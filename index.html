<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#302d2b"/><title>Commonplace — a private reading room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/><link rel="stylesheet" href="/dense-reader.css"/>
</head>
<body><div class="grain"></div>
  <header class="topbar"><a class="wordmark" href="/" aria-label="Commonplace home"><span>c</span>ommonplace</a><p class="local-mark">local library</p><button class="add-button" id="openAdd">+ add</button></header>
  <main id="shelf"><section class="shelf-section shelf-home"><div class="section-heading"><div><p class="eyebrow">your shelf</p><h1>Reading list</h1><p class="shelf-summary" id="shelfSummary"></p></div><div class="filters" role="group" aria-label="Filter items"><button class="filter selected" data-filter="all">all <b id="allCount"></b></button><button class="filter" data-filter="reading">in progress <b id="readingCount"></b></button><button class="filter" data-filter="saved">unread <b id="savedCount"></b></button></div></div><div class="cards" id="cards"></div></section></main>
  <dialog id="adder"><button class="close" aria-label="Close add item">×</button><form id="addForm"><h2>Add to reading list</h2><label>Paste a URL<input name="sourceUrl" type="url" placeholder="https://…"/></label><p class="add-or">or</p><label>Upload a PDF<input name="file" type="file" accept="application/pdf,.pdf"/></label><p class="add-help">The title is taken from page/PDF metadata where available, otherwise from the URL or filename.</p><button class="add-button">add item →</button><p class="form-state" id="addState"></p></form></dialog>
  <footer><span>Local-first. Stored in SQLite.</span><span id="footerCount"></span></footer><script src="/app.js"></script>
</body></html>
