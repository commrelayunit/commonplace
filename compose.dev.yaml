include:
  - path: ${FIRECRAWL_CHECKOUT_DIR:-.dev/firecrawl}/docker-compose.yaml

services:
  pdf-markdown:
    build: ./services/pdf-markdown
    ports:
      - "127.0.0.1:${PDF_SERVICE_PORT:-8008}:8008"
    volumes:
      - pdf-markdown-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

volumes:
  pdf-markdown-cache:
